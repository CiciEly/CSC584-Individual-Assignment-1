
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Profile</title>

    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <div class="page-container">

        <div class="form-card">

            <!-- HEADER -->
            <div class="header">

                <img src="image/profilee.png"
                     alt="Profile Picture"
                     class="profile-image">

                <p class="subtitle">WELCOME!!!</p>

                <h1>Create Your Personal Profile</h1>

                <p class="description">
                    Tell us a little about yourself by filling in the details below.
                </p>

            </div>

            <!-- PROFILE FORM -->
            <form action="ProfileServlet" method="post">

                <!-- FULL NAME -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           required>
                </div>

                <!-- STUDENT ID -->
                <div class="form-group">
                    <label for="studentId">Student ID</label>

                    <input type="text"
                           id="studentId"
                           name="studentId"
                           placeholder="Enter your student ID"
                           required>
                </div>

                <!-- PROGRAMME -->
                <div class="form-group">
                    <label for="programme">Programme</label>

                    <input type="text"
                           id="programme"
                           name="programme"
                           placeholder="e.g. Bachelor of Information Technology"
                           required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@email.com"
                           required>
                </div>

                <!-- HOBBIES -->
                <div class="form-group full-width">
                    <label for="hobbies">Hobbies & Interests</label>
                    <textarea id="hobbies"
                              name="hobbies"
                              rows="4"
                              placeholder="e.g. Reading, travelling, coding"
                              required></textarea>
                </div>

                <!-- SHORT INTRODUCTION -->
                <div class="form-group full-width">
                    <label for="introduction">Short Self-Introduction</label>

                    <textarea id="introduction"
                              name="introduction"
                              rows="4"
                              placeholder="Write something about yourself..."
                              required></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="submit-btn">
                    Create My Profile <span>→</span>
                </button>

            </form>

            <!-- FOOTER -->
            <p class="footer-text">
                CSC584-Personal Profile
            </p>

        </div>

    </div>

</body>
</html>
